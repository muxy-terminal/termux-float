name: Verify Signed Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify release certificate and checksums
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'
          mkdir artifacts
          gh release download "$RELEASE_TAG" --dir artifacts
          cd artifacts
          sha256sum -c ADDON-SHA256SUMS
          for apk in *.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | \
              grep -F 'Signer #1 certificate SHA-256 digest: 756768af514d3fa0d1c214d54dabd7b0cd088a1723a22f520b90e8e8545262ce'
          done
