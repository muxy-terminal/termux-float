name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: addon
      - name: Read muxy source pin
        id: core
        run: echo "revision=$(cat addon/MUXY_CORE.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: muxy-terminal/muxy
          ref: ${{ steps.core.outputs.revision }}
          path: muxy
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned terminal toolchain
        run: |
          python3 muxy/terminal-emulator/native/install-zig.py "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'ndk;29.0.14206865'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build release APK
        working-directory: addon
        run: ./gradlew :app:assembleRelease :app:testReleaseUnitTest
      - uses: actions/upload-artifact@v6
        with:
          name: unsigned-release
          path: addon/app/build/outputs/apk/release/*.apk
